name: Deploy to GitHub Pages

on:
  push:
    branches: [ccr-f1e2fd34-8b8atu]
    paths: [index.html, scripts/**, .github/workflows/pages.yml]
  schedule:
    - cron: "17 13 * * *"   # daily, ~5–6am Pacific
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Read every watchlist company's public job board (Greenhouse, Ashby, Lever) into site/jobs.json.
      - name: Fetch open roles
        run: node scripts/fetch-jobs.mjs

      # Publish only the app and the job data. Personal data never lives in git (private/ is ignored).
      - name: Assemble site
        run: |
          cp index.html site/index.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
