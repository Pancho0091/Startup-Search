name: Deploy to GitHub Pages

on:
  push:
    branches: [ccr-f1e2fd34-8b8atu]
    paths: [index.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the app itself. Personal data never lives in git (private/ is ignored),
      # and this keeps README, workflows, and anything else out of the public site.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
