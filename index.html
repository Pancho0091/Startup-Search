<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startup Search</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with view tabs; each view is a single column of panels; lead detail opens in a right-hand drawer (full screen on phones). */
:root {
  --bg: #f3f6f7;
  --surface: #ffffff;
  --surface-2: #eaf0f2;
  --ink: #15222b;
  --muted: #5a6a75;
  --line: #d6dee3;
  --accent: #0d7680;
  --accent-ink: #ffffff;
  --accent-soft: #d8eef0;
  --sodium: #b86e06;
  --sodium-soft: #fbecd3;
  --good: #2c7f47;
  --good-soft: #dcefe2;
  --bad: #b23c17;
  --bad-soft: #f8e1d8;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161c; --surface: #15212a; --surface-2: #1c2b35; --ink: #e2eaef; --muted: #93a5b1; --line: #263642;
    --accent: #3fb4bd; --accent-ink: #052326; --accent-soft: #143840; --sodium: #f0a640; --sodium-soft: #3a2a12;
    --good: #5cc27d; --good-soft: #17331f; --bad: #f08560; --bad-soft: #3a1c12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161c; --surface: #15212a; --surface-2: #1c2b35; --ink: #e2eaef; --muted: #93a5b1; --line: #263642;
  --accent: #3fb4bd; --accent-ink: #052326; --accent-soft: #143840; --sodium: #f0a640; --sodium-soft: #3a2a12;
  --good: #5cc27d; --good-soft: #17331f; --bad: #f08560; --bad-soft: #3a1c12; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.15rem; }
h3 { font-size: 0.95rem; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1240px; margin: 0 auto; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 1.25rem; letter-spacing: -0.01em; }
.brand .sub { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--font-mono); font-size: 11px; margin-left: 4px; color: var(--muted); }

main { max-width: 1240px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.grid-2 > * { min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 10px; }
.banner { background: var(--sodium-soft); color: var(--ink); border: 1px solid var(--sodium); border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 600; }
input[type=text], input[type=url], input[type=date], input[type=number], input[type=password], input[type=search], select, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 9px;
}
textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.form-grid .wide { grid-column: 1 / -1; }

.pill { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; padding: 2px 8px; border-radius: 999px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.pill.hi { background: var(--good-soft); color: var(--good); }
.pill.mid { background: var(--accent-soft); color: var(--accent); }
.chip { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.arch { background: var(--accent-soft); color: var(--accent); font-family: var(--font-mono); }
.chip.due { background: var(--sodium-soft); color: var(--sodium); }
.chip.over { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--bad-soft); color: var(--bad); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
th[data-sorted]::after { content: attr(data-sorted); margin-left: 4px; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--surface-2); }
.title-cell strong { display: block; }

.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: flex-start; }
.col { flex: 0 0 230px; background: var(--surface-2); border-radius: var(--radius); padding: 8px; min-height: 120px; }
.col.drop { outline: 2px dashed var(--accent); }
.col-head { display: flex; justify-content: space-between; padding: 4px 6px 8px; font-weight: 700; font-family: var(--font-display); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px; margin-bottom: 8px; cursor: pointer; display: grid; gap: 4px; }
.card:hover { border-color: var(--accent); }
.card .top { display: flex; justify-content: space-between; gap: 6px; align-items: start; }
.card .t { font-weight: 600; line-height: 1.3; }

.list-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; cursor: pointer; }
.list-item:last-child { border-bottom: 0; }
.list-item .main { min-width: 0; }
.list-item .main div { overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 12px 0; }

.funnel { display: grid; gap: 6px; }
.funnel-row { display: grid; grid-template-columns: 110px 1fr 36px; gap: 8px; align-items: center; font-size: 13px; }
.bar { height: 10px; border-radius: 3px; background: var(--accent); min-width: 2px; }
.bar-track { background: var(--surface-2); border-radius: 3px; }

.factors { display: grid; gap: 6px; }
.factor { display: grid; grid-template-columns: 120px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; }
.factor .track { height: 8px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.factor .fill { height: 100%; background: var(--accent); }
.factor .fill.ai { background: var(--sodium); }

.drawer-back { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--bg); z-index: 50; overflow-y: auto; border-left: 1px solid var(--line);
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; align-content: start; }
.drawer-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.score-big { font-family: var(--font-mono); font-size: 32px; line-height: 1; font-weight: 500; }
.bullets { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.toast { position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; z-index: 60; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.weights { display: grid; gap: 8px; }
.weight-row { display: grid; grid-template-columns: 130px 1fr 44px; gap: 10px; align-items: center; }
.weight-row input { width: 100%; }
details summary { cursor: pointer; font-weight: 600; }
@media (max-width: 560px) {
  .factor { grid-template-columns: 96px 1fr 50px; }
  .weight-row { grid-template-columns: 100px 1fr 40px; }
  .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><h1>Startup Search</h1><span class="sub">LA / OC startup leads, scored against your profile</span></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main id="view"></main>
<div id="drawer-root"></div>

<script>
"use strict";
/* ============================================================
   Constants: stages, role types, geography
   ============================================================ */
const STORE_KEY = "startup-search:v1";
const KEY_STORE = "startup-search:apikey"; // never exported

const STAGES = [

const ZONES = {

  central: { label: "Central LA / Pasadena", kw: ["downtown los angeles", "dtla", "hollywood", "silver lake", "echo park", "arts district", "koreatown", "pasadena", "glendale", "burbank", "vernon", "los feliz", "atwater village", "eagle rock", "highland park"] },

  unknown: { label: "Unknown", kw: [] }
};
const HOME_ZONES = ["westside", "central", "valley", "longbeach", "oc"];
// One-way peak commute minutes from each home base. Rows follow the freeway reality (405 / 10 / 5 / 110), not straight-line distance.
const COMMUTE_MIN = {
  westside:  { westside: 25, la: 40, central: 45, valley: 45, longbeach: 50, oc: 75 },
  central:   { westside: 45, la: 30, central: 20, valley: 35, longbeach: 45, oc: 60 },
  valley:    { westside: 45, la: 40, central: 35, valley: 20, longbeach: 65, oc: 85 },

// Fit factors (weighted, 0–5 each). Access is applied afterwards as a multiplier, not a weight.
const FACTORS = [
  ["roleFit", "Role fit"], ["thesis", "Focus fit"], ["health", "Company health"],
  ["timing", "Timing"], ["geo", "Commute"], ["level", "Level"]
];
const MODEL_VERSION = 2;
const WEEKLY_TARGETS = [
  ["warm", "Warm conversations", 5, ["message", "coffee", "call"]],
  ["referred", "Referred applications", 3, ["referral"]],
  ["cold", "Cold applications (max)", 5, ["applied"]]
];
const ACT_TYPES = [["note", "Note"], ["message", "Message"], ["coffee", "Coffee / meeting"], ["call", "Call"], ["applied", "Applied (cold)"], ["referral", "Applied (referred)"], ["interview", "Interview"]];

const DEFAULT_SETTINGS = {
  modelVersion: MODEL_VERSION,
  homeZone: "westside",
  maxCommuteHours: 6,
  targetLevel: "lead",
  compFloor: 0,
  weights: { roleFit: 30, thesis: 15, health: 15, timing: 10, geo: 15, level: 15 },
  archPriority: { A: "primary", B: "primary", C: "secondary", D: "secondary", E: "other", F: "secondary", G: "other", H: "other", I: "other", J: "other" },
  useAiScores: true,
  model: "claude-opus-5-5",
  profileSummary: "Analytics and strategy professional with 10+ years across data engineering, consulting, operations strategy, and people/talent analytics. MBA in strategy and operations. Builds pipelines and dashboards (SQL, Snowflake, Fivetran, R, Tableau) and translates analysis for executives. Targeting Analytics Lead / first data hire roles at Series A–C startups in LA/OC, plus HR-tech companies.",
  resumeVersions: ["Builder (A/E)", "Talent (B/D)", "Operator (C/F)"]

const DEFAULT_PROFILE = {
  clusters: {
    domain_talent: { w: 3, kw: ["people analytics", "talent", "recruiting", "recruiter", "talent acquisition", "ats", "hr tech", "workforce", "hiring", "candidate", "people operations"] },
    data_build: { w: 2, kw: ["snowflake", "dbt", "fivetran", "pipeline", "sql", "data infrastructure", "first data", "etl", "data warehouse", "automation", "r shiny"] },
    strategy_ops: { w: 2, kw: ["bizops", "business operations", "strategy", "operations", "chief of staff", "gtm", "planning", "supply chain", "forecasting", "process improvement"] },
    ai: { w: 2, kw: ["llm", "ai", "machine learning", "agents", "genai", "generative ai", "predictive", "ml", "ai-native", "copilot"] },
    viz: { w: 1, kw: ["tableau", "looker", "dashboard", "bi", "metrics", "kpi", "reporting"] }
  },
  negative: ["phd required", "phd in", "10+ years of ml research", "quota-carrying", "quota carrying", "security clearance required", "active clearance"],
  levelTarget: ["lead", "head of", "manager", "founding", "principal", "director", "staff", "chief of staff", "senior manager"],
  levelDown: ["associate", "junior", "analyst i", "entry level", "entry-level", "intern", "coordinator"],
  domainCompanyKw: ["hr tech", "hrtech", "recruiting", "talent", "workforce", "future of work", "people platform", "payroll", "hiring"]

/* ============================================================
   Sample data (fictional, clearly marked) so the tool opens in a working state
   ============================================================ */
function daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); }
function daysAhead(n) { return daysAgo(-n); }
function sampleData() {
  const c = (id, name, o) => Object.assign({ id, name, stage: "", lastRaiseDate: "", sector: "", website: "", aiNative: false, domainMatch: false, notes: "", sample: true }, o);

  const leads = [
    l("l1", "c2", { title: "Head of Analytics", location: "Remote (US)", zone: "remote", workplace: "remote", postedDate: daysAgo(5), compMin: 185000, compMax: 220000, source: "Wellfound",

    l("l2", "c1", { title: "Strategy & Operations Lead", location: "El Segundo, CA", zone: "westside", workplace: "onsite", onsiteDays: 5, postedDate: daysAgo(12), compMin: 170000, compMax: 200000, source: "Built In LA",

    l("l3", "c3", { title: "Senior Manager, Business Operations", location: "Irvine, CA", zone: "oc", workplace: "hybrid", onsiteDays: 3, postedDate: daysAgo(25), compMin: 160000, compMax: 190000, source: "LinkedIn",

  const out = {};

/* ============================================================

}

}

const AI_SCHEMA = {

async function analyzeWithClaude(lead) {
  const key = getKey();
  if (!key) throw new Error("Add your Anthropic API key in Settings first.");
  const c = company(lead);
  const archList = Object.entries(ARCH).map(([k, a]) => `${k} = ${a.name} (${S.settings.archPriority[k]})`).join("\n");
  const proof = S.proofPoints.map((p) => "- " + p.text).join("\n");
  const prompt = `Candidate profile:\n${S.settings.profileSummary}\n\nCandidate proof points:\n${proof || "(none)"}\n\nRole types the candidate targets (with priority):\n${archList}\n\nLead to analyze:\nCompany: ${c.name}\nCompany sector: ${c.sector || "unknown"}\nTitle: ${lead.title || "(no posted role; company is a target)"}\nLocation: ${lead.location || "unknown"}\nText:\n${lead.jd || "(none)"}\n\nExtract the posting fields and score the fit honestly. Pick the single best-matching role type. Use 0 for unknown numbers.`;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2026-10-21",
      "anthropic-beta": "server-side-fallback-2026-07-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: S.settings.model || "claude-opus-5-5",
      max_tokens: 4000,
      fallbacks: "default",
      output_config: { effort: "low", format: { type: "json_schema", schema: AI_SCHEMA } },
      system: "You are a sharp startup recruiter and career strategist helping one candidate triage job leads in the Los Angeles / Orange County startup market. Be candid and specific.",
      messages: [{ role: "user", content: prompt }]
    })

  if (!res.ok) throw new Error((data.error && data.error.message) || "Request failed with status " + res.status);

  if (data.stop_reason === "max_tokens") throw new Error("The response was cut off. Try a shorter posting.");
  const block = (data.content || []).find((b) => b.type === "text");

}

/* ---------- Today ---------- */
function viewToday() {
  const act = S.leads.filter((l) => ACTIVE.includes(l.stage));
  const due = act.filter((l) => l.nextFollowUp && l.nextFollowUp <= today()).sort((a, b) => a.nextFollowUp.localeCompare(b.nextFollowUp));
  const stalled = act.filter(isStalled);
  const fresh = S.leads.filter((l) => ["discovered", "researching"].includes(l.stage)).map((l) => [l, score(l)]).sort((a, b) => b[1] - a[1]);
  const top = fresh.filter(([l]) => l.kind !== "target").slice(0, 6);
  const targets = fresh.filter(([l]) => l.kind === "target").slice(0, 6);
  const wk = new Date(); wk.setDate(wk.getDate() - ((wk.getDay() + 6) % 7)); const weekStart = wk.toISOString().slice(0, 10);
  const weekActs = S.activities.filter((a) => a.date >= weekStart && !a.sample);
  const bands = [["70+", (s) => s >= 70], ["50–69", (s) => s >= 50 && s < 70], ["<50", (s) => s < 50]].map(([label, test]) => {
    const acted = S.leads.filter((l) => !l.sample && ["applied", "screening", "interviewing", "offer", "accepted", "declined", "dead"].includes(l.stage) && test(score(l)));
    const adv = acted.filter((l) => ["screening", "interviewing", "offer", "accepted", "declined"].includes(l.stage));
    return [label, acted.length, adv.length];
  });
  const item = (l, s) => `<div class="list-item" data-open="${l.id}"><div class="main"><div><strong>${esc(company(l).name)}</strong> · ${esc(leadName(l))}</div><div class="row small muted">${archChip(archetype(l))}<span>${STAGE_LABEL[l.stage]}</span>${fuChip(l)}</div></div><span class="${pillClass(s ?? score(l))}">${s ?? score(l)}</span></div>`;
  const counts = STAGES.map(([k, label]) => [label, S.leads.filter((l) => l.stage === k).length]);
  const max = Math.max(1, ...counts.map((c) => c[1]));
  const bySource = {};
  for (const l of S.leads) { const s = l.source || "Unknown"; bySource[s] = bySource[s] || { n: 0, adv: 0 }; bySource[s].n++; if (["screening", "interviewing", "offer", "accepted"].includes(l.stage)) bySource[s].adv++; }
  return `
  <div class="grid-2">
    <section class="panel"><div class="panel-head"><h2>Follow-ups due</h2><span class="muted small">${due.length} due or overdue</span></div>
      ${due.length ? due.map((l) => item(l)).join("") : '<div class="empty">Nothing due. Set a follow-up date on any active lead to schedule it here.</div>'}
      ${stalled.length ? `<h3 style="margin-top:14px">Stalled <span class="muted small">(active, no next step)</span></h3>${stalled.map((l) => item(l)).join("")}` : ""}
    </section>
    <section class="panel"><div class="panel-head"><h2>This week</h2><span class="muted small">Since Monday ${esc(weekStart)}</span></div>
      <div class="funnel">${WEEKLY_TARGETS.map(([k, label, goal, types]) => { const n = weekActs.filter((a) => types.includes(a.type)).length; const over = k === "cold" && n > goal; return `<div class="funnel-row"><span>${label}</span><div class="bar-track"><div class="bar" style="width:${Math.min(n / goal, 1) * 100}%;${over ? "background:var(--bad)" : ""}"></div></div><span class="num">${n}/${goal}</span></div>`; }).join("")}</div>
      <p class="small muted" style="margin:10px 0 0">Log coffees, messages, and applications from a lead's Activity section. Referred applications convert far better than cold ones, so cold applications have a ceiling.</p>
    </section>
  </div>
  <div class="grid-2">
    <section class="panel"><div class="panel-head"><h2>Best postings to act on</h2><span class="muted small">Discovered or researching</span></div>
      ${top.length ? top.map(([l, s]) => item(l, s)).join("") : '<div class="empty">No new postings. Paste one on the Add lead tab.</div>'}
      <div class="row" style="margin-top:12px"><button class="btn primary" data-view-go="add">Add lead</button></div>
    </section>
    <section class="panel"><div class="panel-head"><h2>Target companies to warm up</h2><span class="muted small">No posting yet; find a contact first</span></div>
      ${targets.length ? targets.map(([l, s]) => item(l, s)).join("") : '<div class="empty">No target companies. Add recently funded companies with Add lead → Target company.</div>'}
    </section>
  </div>
  <div class="grid-2">
    <section class="panel"><div class="panel-head"><h2>Pipeline</h2><span class="muted small">${S.leads.length} leads · ${S.companies.length} companies · ${S.contacts.length} contacts</span></div>
      <div class="funnel">${counts.filter((c, i) => i < 7 || c[1]).map(([label, n]) => `<div class="funnel-row"><span>${label}</span><div class="bar-track"><div class="bar" style="width:${n / max * 100}%"></div></div><span class="num">${n}</span></div>`).join("")}</div>
    </section>
    <section class="panel"><div class="panel-head"><h2>Is the score working?</h2><span class="muted small">Leads you've applied to, by score band</span></div>
      <div class="table-wrap"><table><thead><tr><th>Score</th><th>Applied</th><th>Reached screen</th><th>Rate</th></tr></thead><tbody>
      ${bands.map(([b, n, a]) => `<tr><td>${b}</td><td class="num">${n}</td><td class="num">${a}</td><td class="num">${n ? Math.round(a / n * 100) + "%" : "–"}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="small muted" style="margin:10px 0 0">After about 20 applications, high bands should convert better than low ones. If they don't, change the weights in Settings.</p>
    </section>
  </div>
  <div class="grid-2">
    <section class="panel"><div class="panel-head"><h2>Where leads come from</h2><span class="muted small">Advanced = screening or later</span></div>
      <div class="table-wrap"><table><thead><tr><th>Source</th><th>Leads</th><th>Advanced</th><th>Rate</th></tr></thead><tbody>
      ${Object.entries(bySource).sort((a, b) => b[1].n - a[1].n).map(([s, o]) => `<tr><td>${esc(s)}</td><td class="num">${o.n}</td><td class="num">${o.adv}</td><td class="num">${Math.round(o.adv / o.n * 100)}%</td></tr>`).join("") || '<tr><td colspan="4" class="muted">No leads yet</td></tr>'}
      </tbody></table></div>
    </section>
  </div>`;
}

/* ---------- Pipeline board ---------- */

function bindBoard() {
  document.querySelectorAll("[data-drag]").forEach((c) => c.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", c.dataset.drag)));
  document.querySelectorAll(".col").forEach((col) => {

/* ---------- Leads table ---------- */
function viewLeads() {

  else if (filters.stage) rows = rows.filter((r) => r.l.stage === filters.stage);
  if (filters.arch) rows = rows.filter((r) => r.a === filters.arch);
  if (filters.min) rows = rows.filter((r) => r.s >= filters.min);
  const keyFn = { score: (r) => r.s, company: (r) => r.c.name.toLowerCase(), title: (r) => (r.l.title || "").toLowerCase(), type: (r) => r.a, where: (r) => r.l.zone, stage: (r) => STAGES.findIndex((x) => x[0] === r.l.stage), follow: (r) => r.l.nextFollowUp || "9999", posted: (r) => r.l.postedDate || "" }[tableSort.key];
  rows.sort((a, b) => { const x = keyFn(a), y = keyFn(b); return (x > y ? 1 : x < y ? -1 : 0) * tableSort.dir; });
  const th = (k, label, cls = "") => `<th data-sort="${k}" class="${cls}" ${tableSort.key === k ? `data-sorted="${tableSort.dir > 0 ? "▲" : "▼"}"` : ""}>${label}</th>`;

      <label class="field"><span>Stage</span><select id="f-stage"><option value="active">All active</option><option value="">Everything</option>${STAGES.map(([k, l]) => `<option value="${k}" ${filters.stage === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field"><span>Role type</span><select id="f-arch"><option value="">Any</option>${Object.entries(ARCH).map(([k, a]) => `<option value="${k}" ${filters.arch === k ? "selected" : ""}>${k} · ${esc(a.name)}</option>`).join("")}</select></label>
      <label class="field"><span>Minimum score</span><input type="number" id="f-min" min="0" max="100" step="5" value="${filters.min}"></label>
    </div>
    <div class="table-wrap"><table><thead><tr>${th("score", "Score")}${th("company", "Company")}${th("title", "Role")}${th("type", "Type")}${th("where", "Where", "hide-sm")}${th("stage", "Stage")}${th("follow", "Follow-up")}${th("posted", "Posted", "hide-sm")}</tr></thead>
    <tbody>${rows.map((r) => `<tr data-open="${r.l.id}"><td><span class="${pillClass(r.s)}">${r.s}</span></td><td class="title-cell"><strong>${esc(r.c.name)}</strong><span class="small muted">${esc(r.c.stage)}</span></td><td>${esc(leadName(r.l))}${r.l.compMax ? `<div class="small muted num">${money(r.l.compMin)}–${money(r.l.compMax)}</div>` : ""}</td><td>${archChip(r.a)}</td><td class="hide-sm small">${esc(ZONES[r.l.zone]?.label || "")}<div class="muted">${esc(r.l.workplace !== "unknown" ? r.l.workplace : "")}</div></td><td>${STAGE_LABEL[r.l.stage]}</td><td>${fuChip(r.l)}</td><td class="hide-sm num small">${esc(r.l.postedDate)}</td></tr>`).join("") || '<tr><td colspan="8" class="muted">No leads match these filters.</td></tr>'}</tbody></table></div>
  </section>`;

      draft.ai = ai;
      const map = { title: "title", company: "companyName", location: "location", workplace: "workplace", onsite_days: "onsiteDays", comp_min: "compMin", comp_max: "compMax" };
      for (const [a, k] of Object.entries(map)) if (ai[a] && (!draft[k] || draft[k] === "unknown")) draft[k] = ai[a];
      if (draft.zone === "unknown" || draft.zone === "other") draft.zone = detectZone(draft.location);
      render(); toast("Analysis added");
    } catch (err) { st.textContent = err.message; e.target.disabled = false; }
  });
}
function saveDraft() {
  if (!draft.companyName.trim()) { toast("Add a company name first"); document.getElementById("d-companyName").focus(); return; }
  let c = S.companies.find((x) => x.name.toLowerCase() === draft.companyName.trim().toLowerCase());
  if (!c) { c = { id: uid("c"), name: draft.companyName.trim(), stage: "", lastRaiseDate: "", sector: "", website: "", aiNative: false, domainMatch: false, notes: "" }; S.companies.push(c); }
  if (draft.sector) c.sector = draft.sector; if (draft.companyStage) c.stage = draft.companyStage; if (draft.lastRaiseDate) c.lastRaiseDate = draft.lastRaiseDate;
  if (draft.aiNative) c.aiNative = true; if (draft.domainMatch) c.domainMatch = true;
  const dup = draft.url && S.leads.find((l) => l.url && l.url === draft.url);
  if (dup) { toast("This posting is already saved"); openLeadId = dup.id; render(); return; }
  const { lead } = draftLead();
  lead.id = uid("l"); lead.companyId = c.id; lead.source = draft.source;
  S.leads.push(lead); logActivity(lead.id, "note", "Lead added" + (draft.source ? " from " + draft.source : ""));
  save(); draft = null; openLeadId = lead.id; toast("Lead saved"); render();
}

/* ============================================================
   Event delegation
   ============================================================ */
document.addEventListener("click", async (e) => {
  const open = e.target.closest("[data-open]");
  const actEl = e.target.closest("[data-act]");
  const go = e.target.closest("[data-view-go]");
  if (go) { setView(go.dataset.viewGo); return; }
  if (actEl) { await handleAct(actEl.dataset.act, actEl, e); return; }
  if (open && !e.target.closest("input,select,textarea,button,a")) { openLeadId = open.dataset.open; renderDrawer(); }
  const th = e.target.closest("th[data-sort]");
  if (th) { const k = th.dataset.sort; tableSort = { key: k, dir: tableSort.key === k ? -tableSort.dir : (k === "score" ? -1 : 1) }; render(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openLeadId) { openLeadId = null; renderDrawer(); } });

async function handleAct(act, el) {
  const l = openLeadId && byId(S.leads, openLeadId);
  switch (act) {
    case "close": openLeadId = null; render(); break;
    case "fu": l.nextFollowUp = daysAhead(+el.dataset.days); save(); render(); toast("Follow-up set"); break;
    case "add-activity": {
      const type = document.getElementById("act-type").value, text = document.getElementById("act-text").value.trim(), date = document.getElementById("act-date").value || today();
      if (!text) { toast("Describe what happened first"); return; }
      logActivity(l.id, type, text, date);
      const idx = (k) => STAGES.findIndex((x) => x[0] === k);
      if (type === "applied" && idx(l.stage) < idx("applied")) l.stage = "applied";
      if (type === "referral" && idx(l.stage) < idx("applied")) l.stage = "applied";
      if (["message", "coffee", "call"].includes(type) && idx(l.stage) < idx("warming")) l.stage = "warming";
      if (type === "interview" && idx(l.stage) < idx("interviewing")) l.stage = "interviewing";
      if (!l.nextFollowUp || l.nextFollowUp <= today()) l.nextFollowUp = daysAhead(type === "applied" ? 7 : 5);
      save(); render(); toast("Activity logged · follow-up " + l.nextFollowUp); break;
    }
    case "ai-lead": {
      const st = document.getElementById("ai-lead-status"); el.disabled = true; st.textContent = "Analyzing…";
      try { l.ai = await analyzeWithClaude(l); save(); render(); toast("Analysis added"); } catch (err) { st.textContent = err.message; el.disabled = false; }
      break;
    }
    case "del-lead":
      if (el.dataset.confirm) { S.leads = S.leads.filter((x) => x.id !== l.id); S.activities = S.activities.filter((a) => a.leadId !== l.id); openLeadId = null; save(); render(); toast("Lead deleted"); }
      else { el.dataset.confirm = "1"; el.textContent = "Click again to delete"; }
      break;
    case "clear-sample":
      for (const k of ["companies", "leads", "contacts", "activities", "proofPoints"]) S[k] = S[k].filter((x) => !x.sample);
      save(); render(); toast("Sample data removed"); break;
    case "load-sample": { const s = sampleData(); for (const k of Object.keys(s)) { const ids = new Set(S[k].map((x) => x.id)); S[k].push(...s[k].filter((x) => !ids.has(x.id))); } save(); render(); toast("Sample data loaded"); break; }
    case "wipe":
      if (el.dataset.confirm) { const keep = S.settings; S = freshState(false); S.settings = keep; save(); render(); toast("All leads deleted"); }
      else { el.dataset.confirm = "1"; el.textContent = "Click again to delete everything"; }
      break;
    case "add-contact": S.contacts.push({ id: uid("p"), companyId: el.dataset.cid, name: "", role: "", warmth: 0, how: "", link: "", notes: "" }); save(); render(); break;
    case "del-contact": S.contacts = S.contacts.filter((p) => p.id !== el.dataset.pid); save(); render(); break;
    case "del-company": {
      const n = S.leads.filter((x) => x.companyId === el.dataset.cid).length;
      if (n) { toast("Delete its " + n + " lead(s) first"); return; }
      S.companies = S.companies.filter((c) => c.id !== el.dataset.cid); S.contacts = S.contacts.filter((p) => p.companyId !== el.dataset.cid); save(); render(); break;
    }
    case "add-pp": S.proofPoints.push({ id: uid("pp"), text: "", tags: [], keywords: [] }); save(); render(); break;
    case "del-pp": S.proofPoints = S.proofPoints.filter((p) => p.id !== el.dataset.ppid); save(); render(); break;
    case "reset-weights": S.settings.weights = Object.assign({}, DEFAULT_SETTINGS.weights); save(); render(); break;
    case "save-profile":
      try { const p = JSON.parse(document.getElementById("s-profile").value); if (!p.clusters) throw new Error("missing clusters"); S.profile = p; rxCache.clear(); save(); render(); toast("Keyword profile saved"); }
      catch (err) { toast("Not valid JSON: " + err.message); }
      break;
    case "reset-profile": S.profile = structuredClone(DEFAULT_PROFILE); save(); render(); toast("Keyword profile reset"); break;
    case "export": {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "startup-search-backup-" + today() + ".json"; document.body.appendChild(a); a.click(); a.remove();
      toast("Backup downloaded (if your browser allows downloads here)"); break;
    }
    case "copy-json":
      try { await navigator.clipboard.writeText(JSON.stringify(S)); toast("Backup JSON copied"); } catch (err) { toast("Copy was blocked; use Download backup"); }
      break;
  }
}

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "f-q") { filters.q = t.value; rerenderKeepFocus(t); return; }
  if (t.dataset.weight) { S.settings.weights[t.dataset.weight] = +t.value; t.nextElementSibling.textContent = t.value; save(); return; }
});
document.addEventListener("change", (e) => {
  const t = e.target, l = openLeadId && byId(S.leads, openLeadId);
  if (t.id === "f-stage") { filters.stage = t.value; render(); return; }
  if (t.id === "f-arch") { filters.arch = t.value; render(); return; }
  if (t.id === "f-min") { filters.min = +t.value || 0; render(); return; }
  if (t.dataset.weight) { render(); return; }
  if (t.dataset.lfield && l) {
    const k = t.dataset.lfield, prev = l[k];
    l[k] = ["onsiteDays", "compMin", "compMax"].includes(k) ? (+t.value || 0) : t.value;
    if (k === "location") l.zone = detectZone(t.value);
    if (k === "stage" && prev !== l.stage) logActivity(l.id, "stage", "Moved to " + STAGE_LABEL[l.stage]);
    save(); render(); return;
  }
  if (t.dataset.override && l) { l.overrides = l.overrides || {}; if (t.value === "") delete l.overrides[t.dataset.override]; else l.overrides[t.dataset.override] = +t.value; save(); render(); return; }
  if (t.dataset.cfield) { const c = byId(S.companies, t.dataset.cid); c[t.dataset.cfield] = t.value; save(); return; }
  if (t.dataset.cflag) { const c = byId(S.companies, t.dataset.cid); c[t.dataset.cflag] = t.checked; save(); render(); return; }
  if (t.dataset.pfield) { const p = byId(S.contacts, t.dataset.pid); p[t.dataset.pfield] = t.dataset.pfield === "warmth" ? clamp(+t.value || 0) : t.value; save(); return; }
  if (t.dataset.ppfield) { const p = byId(S.proofPoints, t.dataset.ppid); p[t.dataset.ppfield] = t.dataset.ppfield === "keywords" ? t.value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean) : t.value; save(); return; }
  if (t.dataset.pptag) { const p = byId(S.proofPoints, t.dataset.ppid); const set = new Set(p.tags || []); t.checked ? set.add(t.dataset.pptag) : set.delete(t.dataset.pptag); p.tags = [...set]; save(); return; }
  if (t.dataset.arch) { S.settings.archPriority[t.dataset.arch] = t.value; save(); return; }
  const sMap = { "s-homeZone": "homeZone", "s-maxCommuteHours": "maxCommuteHours", "s-targetLevel": "targetLevel", "s-compFloor": "compFloor", "s-model": "model", "s-profileSummary": "profileSummary" };
  if (sMap[t.id]) { const k = sMap[t.id]; S.settings[k] = ["maxCommuteHours", "compFloor"].includes(k) ? (+t.value || 0) : t.value; save(); toast("Saved"); return; }
  if (t.id === "s-resumeVersions") { S.settings.resumeVersions = t.value.split("\n").map((s) => s.trim()).filter(Boolean); save(); toast("Saved"); return; }
  if (t.id === "s-useAiScores") { S.settings.useAiScores = t.checked; save(); return; }
  if (t.id === "s-key") { setKey(t.value.trim()); toast(t.value.trim() ? "API key saved in this browser" : "API key removed"); return; }
  if (t.id === "s-import" && t.files[0]) { readFile(t.files[0], importJSON); t.value = ""; return; }
  if (t.id === "s-csv" && t.files[0]) { readFile(t.files[0], importCSV); t.value = ""; return; }
});
function rerenderKeepFocus(input) { const pos = input.selectionStart; render(); const el = document.getElementById(input.id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } } }
function readFile(file, fn) { const r = new FileReader(); r.onload = () => fn(r.result); r.readAsText(file); }

function importJSON(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast("That file isn't valid JSON"); return; }
  if (d.settings && (d.settings.modelVersion || 1) < MODEL_VERSION) { delete d.settings.weights; delete d.settings.maxOnsiteDays; d.settings.modelVersion = MODEL_VERSION; }
  if (d.settings) { delete d.settings.apiKey; S.settings = Object.assign(S.settings, d.settings); S.settings.weights = Object.fromEntries(FACTORS.map(([k]) => [k, (S.settings.weights || {})[k] ?? DEFAULT_SETTINGS.weights[k]])); }
  if (d.profile) { S.profile = Object.assign(structuredClone(DEFAULT_PROFILE), d.profile); rxCache.clear(); }
  let n = 0;
  for (const k of ["companies", "leads", "contacts", "activities", "proofPoints"]) {
    if (!Array.isArray(d[k])) continue;
    for (const item of d[k]) { const i = S[k].findIndex((x) => x.id === item.id); if (i >= 0) S[k][i] = item; else S[k].push(item); n++; }
  }
  save(); render(); toast("Imported " + n + " records");
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}
function importCSV(text) {
  const rows = parseCSV(text); if (rows.length < 2) { toast("No rows found"); return; }
  const head = rows[0].map((h) => h.trim().toLowerCase().replace(/\s+/g, "_"));
  const get = (r, ...names) => { for (const n of names) { const i = head.indexOf(n); if (i >= 0 && r[i] != null && r[i].trim()) return r[i].trim(); } return ""; };
  let n = 0;
  for (const r of rows.slice(1)) {
    const name = get(r, "company", "company_name", "organization"); if (!name) continue;
    let c = S.companies.find((x) => x.name.toLowerCase() === name.toLowerCase());
    if (!c) { c = { id: uid("c"), name, stage: "", lastRaiseDate: "", sector: "", website: "", aiNative: false, domainMatch: false, notes: "" }; S.companies.push(c); }
    c.sector = get(r, "sector", "industry") || c.sector; c.stage = get(r, "funding_stage", "company_stage", "round") || c.stage; c.lastRaiseDate = get(r, "raise_date", "last_raise", "last_raise_date") || c.lastRaiseDate; c.website = get(r, "website") || c.website;
    const title = get(r, "title", "role", "job_title"), url = get(r, "url", "link", "job_url");
    if (url && S.leads.some((l) => l.url === url)) continue;
    const location = get(r, "location");
    const stage = get(r, "stage").toLowerCase();
    const wp = get(r, "workplace").toLowerCase();
    S.leads.push({ id: uid("l"), companyId: c.id, kind: title ? "posting" : "target", title, url, jd: get(r, "description", "jd", "notes"), location, zone: detectZone(location), workplace: ["onsite", "hybrid", "remote"].includes(wp) ? wp : (/remote/i.test(location) ? "remote" : "unknown"), onsiteDays: 0, compMin: +get(r, "comp_min") || 0, compMax: +get(r, "comp_max") || 0, postedDate: get(r, "posted", "posted_date", "date_posted"), foundDate: today(), stage: STAGE_LABEL[stage] ? stage : "discovered", nextFollowUp: "", resumeVersion: "", archOverride: "", overrides: {}, ai: null, notes: "", source: get(r, "source") || "CSV import" });
    n++;
  }
  save(); render(); toast("Imported " + n + " leads");
}

render();
</script>
